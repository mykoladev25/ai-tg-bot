name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to neurolab.fun
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e  # Exit on any error
            
            echo "📦 Deploying neuro-lab-ai-bot..."
            cd /var/www/ai-tg-bot
            
            echo "🔄 Pulling latest changes..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "📋 Installing/updating dependencies..."
            npm ci --production --prefer-offline --no-audit
            
            echo "♻️  Restarting PM2 process..."
            pm2 restart neurolab-bot --update-env
            
            echo "⏳ Waiting for process to start..."
            sleep 3
            
            echo "✅ Deployment completed!"
            
            echo ""
            echo "📊 PM2 Status:"
            pm2 list | grep neurolab
            
            echo ""
            echo "📝 Recent logs (last 30 lines):"
            pm2 logs neurolab-bot --lines 30 --nostream || echo "⚠️ Could not fetch logs"
            
            echo ""
            echo "🎉 Deploy finished successfully!"

