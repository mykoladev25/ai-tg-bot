<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111b2e;
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #e8eefc;
      --muted: #96a6c7;
      --accent: #4fd1c5;
      --danger: #ff6b6b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(79, 209, 197, 0.16), transparent 38%),
        linear-gradient(160deg, #08101d 0%, #111b2e 100%);
      color: var(--text);
      font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .panel {
      width: min(420px, 100%);
      padding: 32px;
      border-radius: 20px;
      background: rgba(17, 27, 46, 0.92);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-bottom: 12px;
      font-size: 28px;
      line-height: 1.15;
    }

    p {
      margin-bottom: 24px;
      color: var(--muted);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background: rgba(7, 12, 22, 0.6);
      color: var(--text);
      font: inherit;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 14px 18px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #4fd1c5 0%, #7f9cf5 100%);
      color: #08101d;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .hint {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .error {
      display: none;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 107, 107, 0.12);
      color: #ffc0c0;
      border: 1px solid rgba(255, 107, 107, 0.24);
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Admin access</h1>
    <p>Enter the admin token to open the monitoring dashboard. A secure admin cookie will be issued after login.</p>

    <form id="login-form">
      <div id="error" class="error"></div>
      <label for="token">Admin token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required>
      <button type="submit">Open dashboard</button>
    </form>

    <div class="hint">
      The token is only used to create a session cookie. It is not stored in the URL.
    </div>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.style.display = 'none';
      errorBox.textContent = '';

      const token = document.getElementById('token').value.trim();
      const response = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token })
      });

      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.success) {
        errorBox.textContent = result.error || 'Login failed';
        errorBox.style.display = 'block';
        return;
      }

      window.location.href = '/admin/dashboard';
    });
  </script>
</body>
</html>
