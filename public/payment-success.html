<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Платіж успішний</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .success-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: bounce 0.6s ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.5;
        }

        .details {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            font-weight: 500;
        }

        .detail-value {
            color: #333;
            font-weight: 600;
        }

        .button {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .info-box {
            background: #e8f4f8;
            border-left: 4px solid #0099cc;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            text-align: left;
            color: #0066aa;
            font-size: 14px;
        }

        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>

        <h1>Платіж успішний!</h1>
        <div class="subtitle">
            Дякуємо за покупку. Токени вже нараховані на ваш обліковий запис.
        </div>

        <div class="details" id="details">
            <div class="detail-item">
                <span class="detail-label">Статус:</span>
                <span class="detail-value">✅ Завершено</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Завантаження...</span>
                <span class="detail-value">⏳</span>
            </div>
        </div>

        <button class="button" onclick="goToBot()">
            🤖 Повернутись в бот
        </button>

        <div class="info-box">
            <strong>💡 Підказка:</strong>
            Якщо ви не перенаправлені автоматично, натисніть на кнопку вище.
        </div>
    </div>

    <script>
        // Встановити BOT_USERNAME на глобальну змінну
        window.BOT_USERNAME = 'neuro_lab_ai_bot';

        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id'); // Stripe
        const orderId = urlParams.get('order_id'); // LiqPay
        const paymentId = sessionId || orderId;
        const paymentSystem = sessionId ? 'stripe' : 'liqpay';

        console.log(`💳 Payment success page loaded:`, { sessionId, orderId, paymentSystem });

        async function processPayment() {
            if (!paymentId) {
                console.log('❌ No payment ID provided');
                return null;
            }

            // Для LiqPay не потребуємо обробки - webhook вже оброблює
            if (paymentSystem === 'liqpay') {
                console.log('ℹ️ LiqPay payment - webhook processes automatically');
                return { success: true, message: 'LiqPay webhook processing' };
            }

            // Для Stripe обробляємо платіж
            try {
                console.log(`🔄 Processing Stripe payment for session: ${sessionId}`);
                const response = await fetch(`/api/payment/process/${sessionId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();

                if (data.success) {
                    console.log('✅ Stripe payment processed successfully');
                    return data;
                } else {
                    console.warn('⚠️ Payment processing returned error:', data.error);
                    return data;
                }
            } catch (error) {
                console.error('❌ Error processing payment:', error);
                return null;
            }
        }

        async function loadPaymentStatus() {
            if (!paymentId) {
                console.log('No payment ID provided');
                return;
            }

            try {
                // Для LiqPay - викликаємо API для обробки платежу
                if (paymentSystem === 'liqpay') {
                    console.log(`🔄 Processing LiqPay order via API: ${orderId}`);
                    const processResponse = await fetch(`/api/liqpay/process/${orderId}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    const processData = await processResponse.json();
                    console.log('📨 LiqPay process response:', processData);

                    if (processData.success) {
                        document.getElementById('details').innerHTML = `
                            <div class="detail-item">
                                <span class="detail-label">Статус:</span>
                                <span class="detail-value">✅ Платіж оброблений</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Система:</span>
                                <span class="detail-value">💳 LiqPay</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Токенів:</span>
                                <span class="detail-value">${processData.tokens}⚡</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Баланс:</span>
                                <span class="detail-value">${processData.balance.toFixed(2)}⚡</span>
                            </div>
                        `;
                    } else {
                        document.getElementById('details').innerHTML = `
                            <div class="detail-item">
                                <span class="detail-label">Статус:</span>
                                <span class="detail-value">⏳ Платіж в обробці</span>
                            </div>
                            <div class="detail-item" style="font-size: 12px; color: #999;">
                                Можливо займе деякий час.<br>
                                Перевірте повідомлення в боті.
                            </div>
                        `;
                    }

                    setTimeout(() => {
                        goToBot();
                    }, 3000);
                } else {
                    // Для Stripe обробляємо платіж
                    const processResult = await processPayment();

                    // Отримуємо статус
                    const response = await fetch(`/api/payment/status/${sessionId}`);
                    const data = await response.json();

                    if (data.success) {
                        const metadata = data.metadata || {};

                        document.getElementById('details').innerHTML = `
                            <div class="detail-item">
                                <span class="detail-label">Статус:</span>
                                <span class="detail-value">✅ ${data.status === 'paid' ? 'Оплачено' : 'Обробляється'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">План:</span>
                                <span class="detail-value">${metadata.plan || '—'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Токенів:</span>
                                <span class="detail-value">${metadata.tokens || '—'}⚡</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Сесія:</span>
                                <span class="detail-value">${sessionId.substring(0, 10)}...</span>
                            </div>
                        `;

                        setTimeout(() => {
                            goToBot();
                        }, 3000);
                    }
                }
            } catch (error) {
                console.error('Error loading payment status:', error);
                document.getElementById('details').innerHTML = `
                    <div class="detail-item" style="color: #f00;">
                        Помилка обробки платежу.<br>
                        Перевірте повідомлення в боті або зверніться до підтримки.
                    </div>
                `;
            }
        }

        function goToBot() {
            window.location.href = 'https://t.me/' + (window.BOT_USERNAME || 'neuro_lab_ai_bot');
        }

        window.addEventListener('DOMContentLoaded', loadPaymentStatus);
    </script>
</body>
</html>
