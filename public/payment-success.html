<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Платіж успішний</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .success-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: bounce 0.6s ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.5;
        }

        .details {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            font-weight: 500;
        }

        .detail-value {
            color: #333;
            font-weight: 600;
        }

        .button {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .info-box {
            background: #e8f4f8;
            border-left: 4px solid #0099cc;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            text-align: left;
            color: #0066aa;
            font-size: 14px;
        }

        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>

        <h1>Платіж успішний!</h1>
        <div class="subtitle">
            Дякуємо за покупку. Токени вже нараховані на ваш обліковий запис.
        </div>

        <div class="details" id="details">
            <div class="detail-item">
                <span class="detail-label">Статус:</span>
                <span class="detail-value">✅ Завершено</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Завантаження...</span>
                <span class="detail-value">⏳</span>
            </div>
        </div>

        <button class="button" onclick="goToBot()">
            🤖 Повернутись в бот
        </button>

        <div class="info-box">
            <strong>💡 Підказка:</strong>
            Якщо ви не перенаправлені автоматично, натисніть на кнопку вище.
        </div>
    </div>

    <script>
        // Встановити BOT_USERNAME на глобальну змінну
        window.BOT_USERNAME = 'neuro_lab_ai_bot';

        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');

        async function processPayment() {
            if (!sessionId) {
                console.log('❌ No session ID provided');
                return;
            }

            try {
                console.log(`🔄 Processing payment for session: ${sessionId}`);
                const response = await fetch(`/api/payment/process/${sessionId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();

                if (data.success) {
                    console.log('✅ Payment processed successfully');
                    return data;
                } else {
                    console.warn('⚠️ Payment processing returned error:', data.error);
                    return data;
                }
            } catch (error) {
                console.error('❌ Error processing payment:', error);
                return null;
            }
        }

        async function loadPaymentStatus() {
            if (!sessionId) {
                console.log('No session ID provided');
                return;
            }

            try {
                // First, try to process the payment
                const processResult = await processPayment();

                // Then get the status
                const response = await fetch(`/api/payment/status/${sessionId}`);
                const data = await response.json();

                if (data.success) {
                    const metadata = data.metadata || {};

                    document.getElementById('details').innerHTML = `
                        <div class="detail-item">
                            <span class="detail-label">Статус:</span>
                            <span class="detail-value">✅ ${data.status === 'paid' ? 'Оплачено' : 'Обробляється'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">План:</span>
                            <span class="detail-value">${metadata.plan || '—'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Токенів:</span>
                            <span class="detail-value">${metadata.tokens || '—'}⚡</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Сесія:</span>
                            <span class="detail-value">${sessionId.substring(0, 10)}...</span>
                        </div>
                    `;

                    setTimeout(() => {
                        goToBot();
                    }, 3000);
                }
            } catch (error) {
                console.error('Error loading payment status:', error);
            }
        }

        function goToBot() {
            window.location.href = 'https://t.me/' + (window.BOT_USERNAME || 'neuro_lab_ai_bot');
        }

        window.addEventListener('DOMContentLoaded', loadPaymentStatus);
    </script>
</body>
</html>
