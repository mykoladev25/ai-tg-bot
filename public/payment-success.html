<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Платіж успішний</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        width: 100%;
        padding: 40px;
        text-align: center;
      }

      .success-icon {
        font-size: 80px;
        margin-bottom: 20px;
        animation: bounce 0.6s ease-in-out;
      }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }

      h1 {
        color: #333;
        font-size: 32px;
        margin-bottom: 10px;
      }

      .subtitle {
        color: #666;
        font-size: 16px;
        margin-bottom: 30px;
        line-height: 1.5;
      }

      .details {
        background: #f5f5f5;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 30px;
        text-align: left;
      }

      .detail-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #ddd;
      }

      .detail-item:last-child {
        border-bottom: none;
      }

      .detail-label {
        color: #666;
        font-weight: 500;
      }

      .detail-value {
        color: #333;
        font-weight: 600;
      }

      .button {
        display: inline-block;
        padding: 14px 40px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-decoration: none;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        margin-bottom: 20px;
      }

      .button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      }

      .info-box {
        background: #e3f2fd;
        border-left: 4px solid #2196f3;
        padding: 15px;
        border-radius: 4px;
        text-align: left;
        color: #1565c0;
        font-size: 14px;
      }

      .countdown {
        color: #999;
        font-size: 12px;
        margin-top: 20px;
      }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        <h1>Платіж успішний!</h1>
        <div class="subtitle">
            Дякуємо за покупку. Токени вже нараховані на ваш рахунок.
        </div>

        <div class="details" id="details">
            <div class="detail-item">
                <span class="detail-label">Статус:</span>
                <span class="detail-value">✅ Оплачено</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Токени:</span>
                <span class="detail-value">✅ Нараховані</span>
            </div>
        </div>

        <button class="button" onclick="goToBot()">
            🤖 Повернутись в бот
        </button>

        <div class="info-box">
            <strong>💡 Підказка:</strong><br>
            Перевірте баланс токенів в боті.<br>
            Вас автоматично редіректить через <span id="timer">3</span> сек...
        </div>

        <div class="countdown">
            Якщо редірект не спрацював, натисніть кнопку вище ↑
        </div>
    </div>

    <script>
        window.BOT_USERNAME = 'neuro_lab_ai_bot';

        console.log('✅ Payment success page loaded');
        console.log('💡 Payment already processed on server');
        console.log('📱 Tokens added to your account');

        let countdown = 3;

        // Відлік до редіректу
        const timer = setInterval(() => {
            countdown--;
            document.getElementById('timer').textContent = countdown;

            if (countdown <= 0) {
                clearInterval(timer);
                goToBot();
            }
        }, 1000);

        function goToBot() {
            window.location.href = 'https://t.me/' + window.BOT_USERNAME;
        }
    </script>
</body>
</html>
