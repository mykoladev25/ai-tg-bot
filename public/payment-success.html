<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment successful</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 100%);
      color: #0f172a;
      font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(480px, 100%);
      padding: 36px;
      border-radius: 20px;
      background: #fff;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
    }
    .icon { font-size: 64px; margin-bottom: 18px; }
    h1 { margin-bottom: 12px; font-size: 32px; }
    p { color: #475569; margin-bottom: 18px; }
    .details {
      padding: 18px;
      border-radius: 16px;
      background: #f8fafc;
      text-align: left;
      margin-bottom: 24px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #e2e8f0;
    }
    .row:last-child { border-bottom: none; }
    .button {
      display: inline-block;
      padding: 14px 24px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
      color: white;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .note { margin-top: 16px; font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">✅</div>
    <h1>Payment successful</h1>
    <p>Your payment has been received and the token balance should already be updated inside the bot.</p>

    <div class="details">
      <div class="row"><span>Status</span><strong>Paid</strong></div>
      <div class="row"><span>Tokens</span><strong>Credited</strong></div>
    </div>

    <button class="button" onclick="goToBot()">Return to bot</button>
    <div class="note">Redirecting automatically in <span id="timer">3</span> seconds.</div>
  </main>

  <script>
    const botUsername = window.BOT_USERNAME || 'your_bot_username';
    let countdown = 3;

    const timer = setInterval(() => {
      countdown -= 1;
      document.getElementById('timer').textContent = countdown;
      if (countdown <= 0) {
        clearInterval(timer);
        goToBot();
      }
    }, 1000);

    function goToBot() {
      window.location.href = `https://t.me/${botUsername}`;
    }
  </script>
</body>
</html>
