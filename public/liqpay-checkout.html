<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiqPay checkout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #111827 0%, #0ea5e9 100%);
      color: #0f172a;
      font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(520px, 100%);
      padding: 36px;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.3);
    }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 32px; margin-bottom: 8px; color: #0284c7; }
    .header p { color: #64748b; }
    .panel {
      padding: 18px;
      border-radius: 16px;
      background: #f8fafc;
      margin-bottom: 18px;
    }
    .price {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-top: 12px;
    }
    .price strong { font-size: 32px; color: #0284c7; }
    .features { color: #475569; }
    .error {
      display: none;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fee2e2;
      color: #991b1b;
    }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    button {
      flex: 1;
      min-width: 160px;
      padding: 14px 18px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }
    .primary {
      color: white;
      background: linear-gradient(135deg, #0284c7 0%, #7c3aed 100%);
    }
    .secondary {
      background: #e2e8f0;
      color: #0f172a;
    }
    .note { margin-top: 16px; font-size: 13px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <div class="header">
      <h1>LiqPay checkout</h1>
      <p>UAH checkout for token packages.</p>
    </div>

    <div id="error" class="error"></div>

    <section class="panel" id="planInfo">
      <div>Loading plan details...</div>
    </section>

    <section class="panel features" id="features">
      Loading available features...
    </section>

    <div class="actions">
      <button id="payButton" class="primary" onclick="processPayment()">Continue to LiqPay</button>
      <button class="secondary" onclick="goBack()">Back to bot</button>
    </div>

    <div class="note">The final amount and token count are resolved on the server before the payment URL is created.</div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const planKey = params.get('plan');
    const userId = params.get('userId') || params.get('tg_id');
    const botUsername = String(window.BOT_USERNAME || '').replace(/^@/, '');
    let plans = {};

    function showError(message) {
      const box = document.getElementById('error');
      box.textContent = message;
      box.style.display = 'block';
    }

    function renderPlan(plan, exchangeRate) {
      const amount = plan.priceUAHDynamic || Math.round((plan.priceUSD || 0) * (exchangeRate || 45));
      const tokenCount = plan.tokensWayForPay || plan.tokens;
      const features = (plan.features || [])
        .filter((feature) => typeof feature === 'string' && feature.trim())
        .map((feature) => `<div style="margin: 4px 0;">${feature}</div>`)
        .join('');

      document.getElementById('planInfo').innerHTML = `
        <strong>${plan.name}</strong>
        <div class="price">
          <strong>${amount} ₴</strong>
          <span>${tokenCount}⚡ tokens</span>
        </div>
        <div style="margin-top: 12px; color: #475569;">Bonus tokens are applied automatically when the selected plan includes them.</div>
      `;

      document.getElementById('features').innerHTML = features || 'Feature details are not available for this plan.';
    }

    async function loadPlans() {
      const url = userId ? `/api/plans?userId=${encodeURIComponent(userId)}` : '/api/plans';
      const response = await fetch(url);
      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(result.error || 'Failed to load plans');
      }

      plans = result.plans || {};
      const plan = plans[planKey];
      if (!planKey || !plan) {
        throw new Error('Selected plan was not found');
      }

      renderPlan(plan, result.exchangeRate);
    }

    async function processPayment() {
      if (!userId) {
        showError('This checkout link must be opened from the Telegram bot so the user can be identified.');
        return;
      }

      const button = document.getElementById('payButton');
      button.disabled = true;
      button.textContent = 'Creating LiqPay checkout...';

      try {
        const response = await fetch('/api/liqpay/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, plan: planKey })
        });

        const result = await response.json();
        if (!response.ok || !result.success || !result.checkoutUrl) {
          throw new Error(result.error || 'Failed to create LiqPay checkout');
        }

        window.location.href = result.checkoutUrl;
      } catch (error) {
        showError(error.message);
        button.disabled = false;
        button.textContent = 'Continue to LiqPay';
      }
    }

    function goBack() {
      if (window.Telegram?.WebApp) {
        try {
          window.Telegram.WebApp.close();
          return;
        } catch (error) {
          console.warn('Telegram Web App close failed:', error);
        }
      }

      if (window.history.length > 1) {
        window.history.back();
        return;
      }

      if (!botUsername) {
        showError('Bot username is not configured. Open the bot manually in Telegram.');
        return;
      }

      window.location.href = `https://t.me/${botUsername}`;
    }

    loadPlans().catch((error) => {
      showError(error.message);
      document.getElementById('planInfo').innerHTML = '<div>Plan information is unavailable.</div>';
      document.getElementById('features').textContent = '';
    });
  </script>
</body>
</html>
