<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a5f9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9ec5fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5eb3fc;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)" opacity="0.2"/>
  
  <!-- NL text -->
  <text x="50" y="70" 
        font-family="Arial Black, sans-serif" 
        font-size="50" 
        font-weight="900"
        fill="url(#grad)" 
        text-anchor="middle"
        filter="url(#glow)">NL</text>
</svg>