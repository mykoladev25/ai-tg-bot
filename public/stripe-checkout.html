<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neuro.lab.ai - Оплата Stripe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .logo p {
            color: #999;
            font-size: 14px;
        }

        .plan-info {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .plan-info h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .plan-info p {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .price {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-top: 15px;
        }

        .price .amount {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .price .currency {
            font-size: 18px;
            color: #999;
        }

        .price .tokens {
            font-size: 16px;
            color: #999;
            margin-left: auto;
        }

        .features {
            background: #f0f4ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 30px;
        }

        .features h3 {
            color: #667eea;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .features ul {
            list-style: none;
        }

        .features li {
            color: #666;
            font-size: 13px;
            padding: 5px 0;
            padding-left: 20px;
            position: relative;
        }

        .features li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
        }

        .payment-methods {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .payment-methods h3 {
            color: #333;
            font-size: 14px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .method-icons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .method-icon {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
        }

        .checkout-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .checkout-btn:active {
            transform: translateY(0);
        }

        .checkout-btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            border: 1px solid #f88;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .back-btn {
            text-align: center;
            margin-top: 20px;
        }

        .back-btn a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-btn a:hover {
            color: #764ba2;
        }

        .security-note {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🚀 neuro.lab.ai</h1>
            <p>Платіж через Stripe</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div class="plan-info" id="planInfo">
            <h2>Завантаження...</h2>
            <p>Буль ласка, зачекайте...</p>
        </div>

        <div class="payment-methods">
            <h3>Способи оплати</h3>
            <div class="method-icons">
                <div class="method-icon"><svg
                        width="64"
                        height="24"
                        viewBox="0 0 128 48"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-label="Card payment"
                        role="img"
                >
                    <!-- Card body -->
                    <rect
                            x="8"
                            y="10"
                            rx="6"
                            ry="6"
                            width="112"
                            height="28"
                            fill="#000000"
                    />

                    <!-- Magnetic stripe -->
                    <rect
                            x="8"
                            y="16"
                            width="112"
                            height="6"
                            fill="#2C2C2C"
                    />

                    <!-- Chip -->
                    <rect
                            x="16"
                            y="24"
                            rx="2"
                            ry="2"
                            width="14"
                            height="10"
                            fill="#CFCFCF"
                    />
                    <rect
                            x="19"
                            y="24"
                            width="2"
                            height="10"
                            fill="#A0A0A0"
                    />
                    <rect
                            x="23"
                            y="24"
                            width="2"
                            height="10"
                            fill="#A0A0A0"
                    />

                    <!-- Card text -->
                    <text
                            x="38"
                            y="33"
                            font-size="14"
                            font-family="Arial, Helvetica, sans-serif"
                            font-weight="600"
                            fill="#FFFFFF"
                    >
                        Card
                    </text>
                </svg>
                    Карта</div>
                <div class="method-icon"><svg
                        width="64"
                        height="24"
                        viewBox="0 0 128 48"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-label="Apple Pay"
                        role="img"
                >
                    <!-- Apple logo -->
                    <path fill="#000000" d="M33.4 14.2c1.2-1.5 2-3.6 1.8-5.7-1.7.1-3.9 1.1-5.1 2.6-1.1 1.3-2.1 3.4-1.8 5.5 1.9.1 3.9-1 5.1-2.4zm3.1 4.9c-2.8-.2-5.2 1.6-6.6 1.6-1.4 0-3.5-1.5-5.8-1.5-3 0-5.7 1.7-7.2 4.4-3.1 5.4-.8 13.4 2.2 17.8 1.5 2.1 3.2 4.5 5.5 4.4 2.2-.1 3-1.4 5.7-1.4s3.4 1.4 5.8 1.4c2.4 0 4-2.2 5.5-4.3 1.7-2.5 2.4-5 2.4-5.1-.1 0-4.6-1.8-4.7-7.1-.1-4.4 3.6-6.5 3.8-6.6-2.1-3.1-5.3-3.4-6.6-3.5z"/>

                    <!-- Pay text -->
                    <text
                            x="56"
                            y="32"
                            font-size="22"
                            font-family="Arial, Helvetica, sans-serif"
                            font-weight="600"
                            fill="#000000"
                    >
                        Pay
                    </text>
                </svg>
                    Apple Pay</div>
                <div class="method-icon"><svg
                        width="64"
                        height="24"
                        viewBox="0 0 128 48"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-label="Google Pay"
                        role="img"
                >
                    <!-- Google -->
                    <path fill="#4285F4" d="M21.5 24c0-1.3-.1-2.3-.3-3.3H12v6.2h5.3c-.2 1.3-1.5 3.3-5.3 3.3-3.2 0-5.8-2.6-5.8-6.2s2.6-6.2 5.8-6.2c1.8 0 3 .8 3.7 1.4l2.5-2.4C16.6 15.3 14.5 14 12 14c-5.5 0-10 4.5-10 10s4.5 10 10 10c5.8 0 9.5-4.1 9.5-10z"/>
                    <path fill="#EA4335" d="M34 24c0 5.5-4.3 10-9.7 10s-9.7-4.5-9.7-10 4.3-10 9.7-10 9.7 4.5 9.7 10zm-4 0c0-3.3-2.4-5.5-5.7-5.5S18.6 20.7 18.6 24s2.4 5.5 5.7 5.5S30 27.3 30 24z"/>
                    <path fill="#FBBC05" d="M47 24c0 5.5-4.3 10-9.7 10s-9.7-4.5-9.7-10 4.3-10 9.7-10S47 18.5 47 24zm-4 0c0-3.3-2.4-5.5-5.7-5.5S31.6 20.7 31.6 24s2.4 5.5 5.7 5.5S43 27.3 43 24z"/>
                    <path fill="#34A853" d="M59.5 15h4v18.5c0 7.6-4.5 10.7-9.9 10.7-5.1 0-8.2-3.4-9.3-6.2l3.5-1.4c.6 1.5 2.2 3.3 5.8 3.3 3.8 0 6.1-2.3 6.1-6.7v-1.6h-.1c-.9 1.1-2.6 2.1-4.9 2.1-4.7 0-9-4.1-9-9.4 0-5.4 4.3-9.5 9-9.5 2.3 0 4 1 4.9 2.1h.1V15z"/>

                    <!-- Pay -->
                    <text x="74" y="31" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#5F6368">
                        Pay
                    </text>
                </svg>
                    Google Pay</div>
            </div>
        </div>

        <button class="checkout-btn" id="checkoutBtn" onclick="startCheckout()">
            🛒 Перейти до оплати
        </button>

        <div class="back-btn">
            <a href="javascript:goBack()">← Повернутись в бот</a>
        </div>

        <div class="security-note">
            🔒 Платіж захищений SSL. Ваші дані в безпеці.
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Инициализируем Telegram Web App
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;

            // Расширяем на весь экран
            tg.expand();

            // Показываем кнопку "назад" если она доступна
            if (tg.BackButton) {
                tg.BackButton.show();
                tg.BackButton.onClick(() => {
                    goBack();
                });
            }

            console.log('✅ Telegram Web App initialized');
        }

        // Отримуємо параметри з URL
        const urlParams = new URLSearchParams(window.location.search);
        const plan = urlParams.get('plan');
        const userId = urlParams.get('userId');
        const telegramId = urlParams.get('tg_id');

        // Дебаг логування
        console.log('URL Params:', {
            plan,
            userId,
            telegramId,
            fullUrl: window.location.href
        });

        // Зберігаємо плани з сервера
        let plans = {};

        async function loadPlans() {
            try {
                const response = await fetch('/api/plans');
                const data = await response.json();

                if (data.success) {
                    plans = data.plans;
                    console.log('✅ Plans loaded from server:', plans);
                    loadPlanInfo();
                } else {
                    showError('Не вдалось завантажити інформацію про плани');
                }
            } catch (error) {
                console.error('Error loading plans:', error);
                showError('Помилка при завантаженні даних: ' + error.message);
            }
        }

        function loadPlanInfo() {
            if (!plan || !plans[plan]) {
                showError('План не знайдено');
                return;
            }

            const planData = plans[plan];
            const planHtml = `
                <h2>${planData.name}</h2>
                <p>${planData.tokens}⚡ токенів для всіх генерацій</p>
                <div class="price">
                    <span class="amount">$${planData.price.toFixed(2)}</span>
                    <span class="currency">USD</span>
                    <span class="tokens">${planData.tokens}⚡</span>
                </div>
            `;

            document.getElementById('planInfo').innerHTML = planHtml;

            // Завантажуємо features
            const featuresHtml = planData.features
                .filter(f => f && typeof f === 'string' && !f.startsWith('•'))
                .map(f => `<li>${f}</li>`)
                .join('');

            const featuresDiv = document.querySelector('.features');
            if (featuresDiv && featuresHtml) {
                featuresDiv.innerHTML = `<h3>Що входить</h3><ul>${featuresHtml}</ul>`;
            }
        }

        async function startCheckout() {
            const btn = document.getElementById('checkoutBtn');

            if (!plan || !plans[plan]) {
                showError('План не обрано');
                return;
            }

            if (!userId && !telegramId) {
                showError(
                    '⚠️ Помилка: Не вдалось визначити користувача.\n\n' +
                    '💡 Будь ласка, відкрийте це посилання безпосередньо в боту через кнопку "💳 Stripe", а не в браузері.'
                );
                console.error('Missing userId and telegramId. URL:', window.location.href);
                return;
            }

            const actualUserId = userId || telegramId;

            try {
                btn.disabled = true;
                btn.innerHTML = '<span class="loading-spinner"></span> Завантаження...';

                const response = await fetch('/api/stripe/checkout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userId: actualUserId,
                        plan: plan,
                        tokens: plans[plan].tokens,
                        amount: Math.round(plans[plan].price * 100) // Convert to cents
                    })
                });

                const data = await response.json();

                if (data.success && data.url) {
                    window.location.href = data.url;
                } else {
                    showError(data.error || 'Помилка створення платежу');
                    btn.disabled = false;
                    btn.innerHTML = '🛒 Перейти до оплати';
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Помилка: ' + error.message);
                btn.disabled = false;
                btn.innerHTML = '🛒 Перейти до оплати';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function goBack() {
            // Try Telegram Web App API first
            if (window.Telegram && window.Telegram.WebApp) {
                try {
                    // For Web App mode, use close() or BackButton handler
                    if (window.Telegram.WebApp.BackButton) {
                        window.Telegram.WebApp.BackButton.click();
                        return;
                    }
                    window.Telegram.WebApp.close();
                    return;
                } catch (e) {
                    console.warn('Web App API failed, falling back to history:', e);
                }
            }

            // Fallback: browser history
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // Last resort: redirect to bot
                const botUsername = 'neuro_lab_ai_bot';
                const tgUrl = `https://t.me/${botUsername}`;
                window.location.href = tgUrl;
            }
        }

        // Завантажуємо плани при завантаженні сторінки
        window.addEventListener('DOMContentLoaded', loadPlans);
    </script>
</body>
</html>
