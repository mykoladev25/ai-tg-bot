<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stripe checkout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #111827 0%, #3b82f6 100%);
      color: #0f172a;
      font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(520px, 100%);
      padding: 36px;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.3);
    }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 32px; margin-bottom: 8px; color: #2563eb; }
    .header p { color: #64748b; }
    .panel {
      padding: 18px;
      border-radius: 16px;
      background: #f8fafc;
      margin-bottom: 18px;
    }
    .price {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-top: 12px;
    }
    .price strong { font-size: 32px; color: #2563eb; }
    .features ul { margin-left: 18px; color: #475569; }
    .methods { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .badge {
      padding: 8px 12px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid #dbeafe;
      color: #1d4ed8;
      font-size: 13px;
    }
    .error {
      display: none;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fee2e2;
      color: #991b1b;
    }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    button, .link {
      flex: 1;
      min-width: 160px;
      padding: 14px 18px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }
    .primary {
      color: white;
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
    }
    .secondary {
      background: #e2e8f0;
      color: #0f172a;
    }
    .note { margin-top: 16px; font-size: 13px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <div class="header">
      <h1>Stripe checkout</h1>
      <p>Secure card checkout for bot token packages.</p>
    </div>

    <div id="error" class="error"></div>

    <section class="panel" id="planInfo">
      <div>Loading plan details...</div>
    </section>

    <section class="panel features">
      <strong>Accepted methods</strong>
      <div class="methods">
        <span class="badge">Cards</span>
        <span class="badge">Apple Pay</span>
        <span class="badge">Google Pay</span>
      </div>
    </section>

    <div class="actions">
      <button id="payButton" class="primary" onclick="startCheckout()">Continue to payment</button>
      <button class="secondary" onclick="goBack()">Back to bot</button>
    </div>

    <div class="note">The final Stripe session is created server-side. Client-provided pricing is ignored.</div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const planKey = params.get('plan');
    const userId = params.get('userId') || params.get('tg_id');
    const botUsername = window.BOT_USERNAME || 'your_bot_username';
    let plans = {};

    function showError(message) {
      const box = document.getElementById('error');
      box.textContent = message;
      box.style.display = 'block';
    }

    function renderPlan(plan) {
      const features = (plan.features || [])
        .filter((feature) => typeof feature === 'string' && feature.trim())
        .map((feature) => `<li>${feature}</li>`)
        .join('');

      document.getElementById('planInfo').innerHTML = `
        <strong>${plan.name}</strong>
        <div class="price">
          <strong>$${Number(plan.priceUSD || 0).toFixed(2)}</strong>
          <span>${plan.tokens}⚡ tokens</span>
        </div>
        <div style="margin-top: 12px; color: #475569;">Tokens never expire.</div>
        ${features ? `<div style="margin-top: 12px;"><ul>${features}</ul></div>` : ''}
      `;
    }

    async function loadPlans() {
      const url = userId ? `/api/plans?userId=${encodeURIComponent(userId)}` : '/api/plans';
      const response = await fetch(url);
      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(result.error || 'Failed to load plans');
      }

      plans = result.plans || {};
      const plan = plans[planKey];
      if (!planKey || !plan) {
        throw new Error('Selected plan was not found');
      }

      renderPlan(plan);
    }

    async function startCheckout() {
      if (!userId) {
        showError('This checkout link must be opened from the Telegram bot so the user can be identified.');
        return;
      }

      const button = document.getElementById('payButton');
      button.disabled = true;
      button.textContent = 'Creating Stripe session...';

      try {
        const response = await fetch('/api/stripe/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, plan: planKey })
        });

        const result = await response.json();
        if (!response.ok || !result.success || !result.url) {
          throw new Error(result.error || 'Failed to create Stripe checkout session');
        }

        window.location.href = result.url;
      } catch (error) {
        showError(error.message);
        button.disabled = false;
        button.textContent = 'Continue to payment';
      }
    }

    function goBack() {
      if (window.Telegram?.WebApp) {
        try {
          window.Telegram.WebApp.close();
          return;
        } catch (error) {
          console.warn('Telegram Web App close failed:', error);
        }
      }

      if (window.history.length > 1) {
        window.history.back();
        return;
      }

      window.location.href = `https://t.me/${botUsername}`;
    }

    loadPlans().catch((error) => {
      showError(error.message);
      document.getElementById('planInfo').innerHTML = '<div>Plan information is unavailable.</div>';
    });
  </script>
</body>
</html>
